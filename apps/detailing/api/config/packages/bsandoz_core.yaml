# Réglages du kit bsandoz/core pour Perfect Clean (démonstration).
# Valeurs par défaut : le pro les modifie dans son espace (règles de réservation, zone), prioritaires sur ce fichier.
bsandoz_core:
    timezone: 'Europe/Paris'
    mail:
        from_email: '%env(MAILER_FROM)%'
        from_name: 'Perfect Clean'
        brand: 'Perfect Clean'
        front_url: '%env(FRONT_URL)%'
        pro_email: '%env(default::PRO_EMAIL)%'
    payment:
        # Pages du site où Stripe renvoie le client après paiement ou abandon.
        success_url: '%env(FRONT_URL)%/confirmation?reservation={reservationId}'
        cancel_url: '%env(FRONT_URL)%/reserver?paiement=annule&reservation={reservationId}'
    rules:
        min_notice_hours: 24
        horizon_days: 60
        buffer_min: 30
        slot_step_min: 30
        free_cancel_hours: 48
        deposit_percent: 30
        hold_minutes: 10
    zone:
        # Départ d'Abbeville (centre-ville) : déplacement offert jusqu'à 5 km, puis par tranches, intervention jusqu'à 50 km
        # (au-delà : sur devis, hors zone en ligne). Modifiable dans l'espace pro (Réglages → Zone d'intervention).
        origin_lat: 50.1054
        origin_lng: 1.8357
        free_radius_km: 5
        price_per_km_cents: 0
        max_distance_km: 50
        paliers:
            - { jusqua_km: 15, prix_cents: 500 }
            - { jusqua_km: 30, prix_cents: 1000 }
            - { jusqua_km: 50, prix_cents: 2000 }

# Tests : zone fixe (Amiens, 15 km offerts, 0,50 €/km, 60 km max) sur laquelle reposent les scénarios des tests fonctionnels.
when@test:
    bsandoz_core:
        medias_dir: '%kernel.project_dir%/var/test-medias'
        zone:
            origin_lat: 49.8941
            origin_lng: 2.2958
            free_radius_km: 15
            price_per_km_cents: 50
            max_distance_km: 60
            paliers: []
