# Réglages du kit bsandoz/core pour Atelier Brillance (démonstration).
# Seront modifiables dans l'espace pro (branche feature/core-admin).
bsandoz_core:
    timezone: 'Europe/Paris'
    mail:
        from_email: '%env(MAILER_FROM)%'
        from_name: 'Atelier Brillance'
        brand: 'Atelier Brillance'
        front_url: '%env(FRONT_URL)%'
        pro_email: '%env(default::PRO_EMAIL)%'
    payment:
        # Pages du site où Stripe renvoie le client après paiement ou abandon.
        success_url: '%env(FRONT_URL)%/confirmation?reservation={reservationId}'
        cancel_url: '%env(FRONT_URL)%/reserver?paiement=annule&reservation={reservationId}'
    rules:
        min_notice_hours: 24
        horizon_days: 60
        buffer_min: 15
        slot_step_min: 30
        free_cancel_hours: 48
        deposit_percent: 30
        hold_minutes: 10
    zone:
        # Point de départ de démonstration (Amiens), comme les données de démo du front.
        origin_lat: 49.8941
        origin_lng: 2.2958
        free_radius_km: 15
        price_per_km_cents: 50
        max_distance_km: 60
