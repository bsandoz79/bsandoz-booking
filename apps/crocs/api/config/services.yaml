# Services de l'application Croc's : tout vient du kit bsandoz/core (module Carte, contenu du site, espace pro).
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

# Tests : horloge figée au dimanche 1er novembre 2026 10:00 UTC, faux Stripe et faux service push (aucun appel réseau).
when@test:
    services:
        Bsandoz\Core\Shared\Infrastructure\FrozenClock:
            arguments: ['2026-11-01 10:00:00']
        Bsandoz\Core\Shared\Domain\Clock: '@Bsandoz\Core\Shared\Infrastructure\FrozenClock'
        App\Tests\Double\FauxPrestatairePaiement: ~
        Bsandoz\Core\Payment\Domain\Port\PaymentGateway: '@App\Tests\Double\FauxPrestatairePaiement'
        Bsandoz\Core\Abonnement\Domain\Port\PrestataireAbonnement: '@App\Tests\Double\FauxPrestatairePaiement'
        App\Tests\Double\FauxEnvoiPush: ~
        Bsandoz\Core\Notification\Domain\Port\EnvoiPush: '@App\Tests\Double\FauxEnvoiPush'
