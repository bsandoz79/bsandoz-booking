# Déploiement de la démo Perfect Clean sur o2switch (FTPS), après une CI verte sur main, ou à la demande.
# Guide complet : docs/deploiement.md. Secrets et variables à créer dans GitHub (Settings → Secrets and variables → Actions).
name: Déploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cible:
        description: 'Que déployer ?'
        type: choice
        options: [tout, front, api]
        default: tout

concurrency:
  group: deploiement-demo
  cancel-in-progress: false

jobs:
  front:
    name: Front (demo.bsandoz.fr)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.cible != 'api')
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Vérifier la configuration FTP
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR_FRONT }}
        run: |
          manquants=""
          [ -n "$FTP_SERVER" ] || manquants="$manquants FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || manquants="$manquants FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || manquants="$manquants FTP_PASSWORD"
          [ -n "$FTP_DIR" ] || manquants="$manquants FTP_SERVER_DIR_FRONT"
          if [ -n "$manquants" ]; then
            echo "::warning title=Déploiement non configuré::Secrets manquants dans l'environnement GitHub « demo » :$manquants. Envoi ignoré (voir docs/deploiement.md § 3)."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.pret == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.config.outputs.pret == 'true'
        with: { node-version: 22 }
      - run: npm install
        if: steps.config.outputs.pret == 'true'
        working-directory: packages/ui
      - run: npm install
        if: steps.config.outputs.pret == 'true'
        working-directory: apps/detailing/front
      - name: Build (adresse de l'API en variable GitHub VITE_API_URL)
        if: steps.config.outputs.pret == 'true'
        run: npm run build
        working-directory: apps/detailing/front
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Adresse publique du site (pages pré-générées, sitemap) ; par défaut https://demo.bsandoz.fr
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - name: Envoi FTPS
        if: steps.config.outputs.pret == 'true'
        # lftp plutôt que FTP-Deploy-Action : ce dernier échoue en FTPS avec les versions récentes d'OpenSSL
        # (« tls_process_new_session_ticket: length mismatch » sur le canal de données). Certificat vérifié :
        # FTP_SERVER doit être le nom couvert par le certificat (chez o2switch, le nom du serveur, ex. muguet.o2switch.net).
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR_FRONT }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          # Intermédiaires Let's Encrypt absents côté serveur : chaîne reconstituée, certificat toujours vérifié.
          # TLS 1.2 : en TLS 1.3, lftp (gnutls) échoue sur le canal de données (« gnutls_record_recv: Error in parsing »).
          sh .github/chaine-ftps.sh "$FTP_SERVER" "$RUNNER_TEMP/chaine-ftps.pem"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:ca-file $RUNNER_TEMP/chaine-ftps.pem; set ssl:priority NORMAL:-VERS-TLS1.3; set ftp:ssl-force true; set ftp:ssl-protect-data true;
            set net:max-retries 3; set net:reconnect-interval-base 5; set net:timeout 30;
            mirror --reverse --no-perms --parallel=4 --verbose=1 apps/detailing/front/dist/ $FTP_DIR;
            bye"

  api:
    name: API (api.demo.bsandoz.fr)
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.cible != 'front')
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Vérifier la configuration FTP
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR_API }}
        run: |
          manquants=""
          [ -n "$FTP_SERVER" ] || manquants="$manquants FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || manquants="$manquants FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || manquants="$manquants FTP_PASSWORD"
          [ -n "$FTP_DIR" ] || manquants="$manquants FTP_SERVER_DIR_API"
          if [ -n "$manquants" ]; then
            echo "::warning title=Déploiement non configuré::Secrets manquants dans l'environnement GitHub « demo » :$manquants. Envoi ignoré (voir docs/deploiement.md § 3)."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.pret == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        if: steps.config.outputs.pret == 'true'
        with: { php-version: '8.3', tools: composer }
      - name: Dépendances de production (kit copié dans vendor, pas de lien symbolique)
        if: steps.config.outputs.pret == 'true'
        working-directory: apps/detailing/api
        run: composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction --no-scripts --prefer-dist
        env:
          COMPOSER_MIRROR_PATH_REPOS: '1'
      - name: Archive de l'API (un seul fichier à envoyer, sans var/, tests ni secrets)
        if: steps.config.outputs.pret == 'true'
        run: |
          mkdir -p envoi-api/deploy
          cd apps/detailing/api
          zip -qr ../../../envoi-api/api.zip . -x 'var/*' 'tests/*' '.env.local' '.env.*.local' '.env.test' 'phpunit.dist.xml' 'phpstan.neon.dist' '.phpunit.cache/*' '.git*'
          cp deploy/apres-envoi.sh ../../../envoi-api/deploy/
          ls -lh ../../../envoi-api/api.zip
      - name: Envoi FTPS (archive + script de décompression)
        if: steps.config.outputs.pret == 'true'
        # lftp plutôt que FTP-Deploy-Action : ce dernier échoue en FTPS avec les versions récentes d'OpenSSL
        # (« tls_process_new_session_ticket: length mismatch » sur le canal de données). Certificat vérifié :
        # FTP_SERVER doit être le nom couvert par le certificat (chez o2switch, le nom du serveur, ex. muguet.o2switch.net).
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR_API }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          # Intermédiaires Let's Encrypt absents côté serveur : chaîne reconstituée, certificat toujours vérifié.
          # TLS 1.2 : en TLS 1.3, lftp (gnutls) échoue sur le canal de données (« gnutls_record_recv: Error in parsing »).
          sh .github/chaine-ftps.sh "$FTP_SERVER" "$RUNNER_TEMP/chaine-ftps.pem"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:ca-file $RUNNER_TEMP/chaine-ftps.pem; set ssl:priority NORMAL:-VERS-TLS1.3; set ftp:ssl-force true; set ftp:ssl-protect-data true;
            set net:max-retries 3; set net:reconnect-interval-base 5; set net:timeout 30;
            mirror --reverse --no-perms --parallel=4 --verbose=1 envoi-api/ $FTP_DIR;
            bye"
      - name: Rappel
        if: steps.config.outputs.pret == 'true'
        run: |
          echo "Archive envoyée. Sur le serveur (terminal cPanel) : sh deploy/apres-envoi.sh — décompresse, vide le cache et applique les migrations."
