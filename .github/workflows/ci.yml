name: CI

# Vérifications sur main uniquement (les branches sont vérifiées en local avant fusion), pas pour la seule doc ;
# un nouvel envoi annule la vérification encore en cours sur la même branche. Installations mises en cache.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kit back (packages/core)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/core } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-core-${{ hashFiles('packages/core/composer.lock') }}
          restore-keys: composer-core-
      - run: composer install --no-interaction --prefer-dist
      - run: composer stan
      - run: composer test

  detailing-api:
    name: Detailing – API
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/detailing/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-api-${{ hashFiles('apps/detailing/api/composer.lock') }}
          restore-keys: composer-api-
      - run: composer install --no-interaction --prefer-dist
      - run: php bin/console lint:container
      - name: Cache de production (proxies Doctrine, comme sur le serveur)
        run: php bin/console cache:warmup --env=prod --no-debug
        env: { APP_SECRET: ci }
      - run: composer stan
      - run: composer test

  ui:
    name: Kit front (packages/ui)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/ui/package-lock.json }
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  detailing-front:
    name: Detailing – front
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/detailing/front } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/ui/package-lock.json
            apps/detailing/front/package-lock.json
      - run: npm install
        working-directory: packages/ui
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
