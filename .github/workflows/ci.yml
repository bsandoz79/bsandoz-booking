name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core:
    name: Kit back (packages/core)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/core } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer }
      - run: composer install --no-interaction --prefer-dist
      - run: composer stan
      - run: composer test

  ui:
    name: Kit front (packages/ui)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  detailing-front:
    name: Detailing – front
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/detailing/front } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run test
      - run: npm run build
